[build]
command = 'hugo'
publish = 'public'
[build.environment]
HUGO_VERSION = '0.92.1'
HUGO_BASEURL = 'https://fiona-novale.erinnermich.eu/'


[context]
[context.branch-deploy]
command = 'hugo -F -b $DEPLOY_PRIME_URL'

[context.deploy-preview]
command = 'hugo -F -b $DEPLOY_PRIME_URL'

[context.production]
[context.production.environment]
HUGO_ENV = 'production'

# --- 301 redirects ---
[[redirects]]
  from = "/zeitwunden/"
  to = "/romane/"
  status = 301

[[redirects]]
  from = "/zeitwunden/social/"
  to = "/romane/zeitwunden/"
  status = 301
